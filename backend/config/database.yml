default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  primary:
    <<: *default
    database: lunababy_development
  queue:
    <<: *default
    database: lunababy_development
    migrations_paths: db/queue_migrate
    # Same database as primary: dumping it would overwrite queue_schema.rb with the app schema.
    schema_dump: false

test:
  primary:
    <<: *default
    database: lunababy_test
  queue:
    <<: *default
    database: lunababy_test
    migrations_paths: db/queue_migrate
    # Same database as primary: dumping it would overwrite queue_schema.rb with the app schema.
    schema_dump: false

production:
  primary:
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
    prepared_statements: false
  queue:
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
    prepared_statements: false
    migrations_paths: db/queue_migrate
    # Same database as primary: dumping it would overwrite queue_schema.rb with the app schema.
    schema_dump: false
  cache:
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
    prepared_statements: false
    migrations_paths: db/cache_migrate
    schema_dump: false
