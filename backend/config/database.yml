default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  primary:
    <<: *default
    database: lunababy_development
  queue:
    <<: *default
    database: lunababy_development
    migrations_paths: db/queue_migrate
    # Same database as primary: dumping it would overwrite queue_schema.rb with the app schema.
    schema_dump: false

test:
  primary:
    <<: *default
    database: lunababy_test
  queue:
    <<: *default
    database: lunababy_test
    migrations_paths: db/queue_migrate
    # Same database as primary: dumping it would overwrite queue_schema.rb with the app schema.
    schema_dump: false

# Supabase's transaction pooler hands each transaction a different server connection, so
# session-level features break: prepared statements, and the advisory lock db:migrate takes
# (it is acquired on one connection and released on another, which aborts the deploy).
production:
  primary:
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
    prepared_statements: false
    advisory_locks: false
  queue:
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
    prepared_statements: false
    advisory_locks: false
    migrations_paths: db/queue_migrate
    # Same database as primary: dumping it would overwrite queue_schema.rb with the app schema.
    schema_dump: false
  cache:
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
    prepared_statements: false
    advisory_locks: false
    migrations_paths: db/cache_migrate
    schema_dump: false
